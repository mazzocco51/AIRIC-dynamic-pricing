[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hackathon-kit"
version = "0.2.1"
description = "Offline experimental market agents and adaptable competition interface"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
optimize = ["scipy>=1.11"]
plots = ["matplotlib>=3.8"]
test = ["pytest>=8"]

[project.scripts]
hackathon = "hackathon_kit.cli:main"

[tool.setuptools]
packages = ["hackathon_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
